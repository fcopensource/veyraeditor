<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/veyra.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veyra</title>
    <style>
      /* Launch screen: the hummingbird flies in, hovers, and "Veyra Studio" types itself out from the cursor at its
         beak. Pure HTML and CSS, shown before any script runs; main.tsx sets the status and fades it out. */
      html, body { margin: 0; background: #07081a }
      #splash { position: fixed; inset: 0; z-index: 2147483000; overflow: hidden; display: grid; place-items: center;
        background: radial-gradient(900px 620px at 50% 42%, #1a1d52 0%, #0d0f2c 45%, #07081a 100%);
        font-family: Inter, "Segoe UI", system-ui, sans-serif; color: #edf5f5; -webkit-user-select: none; user-select: none; cursor: default;
        transition: opacity .55s ease, visibility .55s }
      #splash.done { opacity: 0; visibility: hidden; pointer-events: none }

      /* sky */
      #splash .sky { position: absolute; inset: 0; pointer-events: none }
      #splash .aurora { position: absolute; left: 50%; top: 58%; width: 760px; height: 300px; transform: translate(-50%, -50%);
        background: radial-gradient(closest-side, #68f4d11f, transparent 70%); filter: blur(10px); animation: splash-breathe 5s ease-in-out infinite }
      #splash .halo { position: absolute; left: 50%; top: 44%; width: 520px; height: 520px; transform: translate(-50%, -50%);
        background: radial-gradient(closest-side, #6d5cf62e, transparent 72%) }

      /* stage */
      #splash .stage { position: relative; display: grid; justify-items: center; gap: 22px; animation: splash-rise .7s cubic-bezier(.2, .8, .2, 1) both }
      #splash .row { display: flex; align-items: center }
      #splash .bird { width: 172px; height: auto; overflow: visible; margin-right: 6px; animation: splash-arrive .9s cubic-bezier(.2, .9, .25, 1) both }
      #splash .hover { animation: splash-hover 2.4s ease-in-out .9s infinite }
      #splash .wl { transform-box: fill-box; transform-origin: 100% 100%; animation: splash-flap .13s ease-in-out infinite alternate }
      #splash .wr { transform-box: fill-box; transform-origin: 0% 100%; animation: splash-flap .13s ease-in-out -.065s infinite alternate }
      #splash .trail { stroke-dasharray: 46 400; animation: splash-trail 1.6s ease-out .2s both }

      #splash .word { display: flex; align-items: center; height: 72px; margin-top: -26px }
      #splash .word span { display: inline-block; font-size: 56px; font-weight: 700; letter-spacing: -1.6px; color: #edf5f5; opacity: 0;
        animation: splash-type .01s linear both }
      #splash .word .sp { width: .28em }
      /* "Studio" in the website's headline gradient (mint, cyan, lavender), spread across its six letters */
      #splash .word .studio { color: transparent; background: linear-gradient(100deg, #68f4d1, #4cdcf2, #b79bff) 0 0 / 600% 100%; -webkit-background-clip: text; background-clip: text }
      #splash .word .studio:nth-of-type(8) { background-position: 20% 0 } #splash .word .studio:nth-of-type(9) { background-position: 40% 0 }
      #splash .word .studio:nth-of-type(10) { background-position: 60% 0 } #splash .word .studio:nth-of-type(11) { background-position: 80% 0 }
      #splash .word .studio:nth-of-type(12) { background-position: 100% 0 }
      #splash .caret { width: 5px; height: 54px; margin-left: 6px; border-radius: 3px; background: #68f4d1; box-shadow: 0 0 18px #68f4d199;
        animation: splash-caret 1s steps(1) infinite }
      #splash .tagline em { font-style: normal; font-weight: 600; color: transparent; background: linear-gradient(100deg, #68f4d1, #4cdcf2, #b79bff); -webkit-background-clip: text; background-clip: text }
      #splash .tagline { margin: -6px 0 0; font-size: 17px; letter-spacing: .2px; color: #9aa7b4; opacity: 0; animation: splash-fade .6s ease 1.25s both }

      /* bottom */
      #splash .foot { position: absolute; left: 50%; bottom: 46px; width: min(460px, calc(100vw - 48px)); transform: translateX(-50%); display: grid; gap: 12px }
      #splash .bar { position: relative; height: 2px; overflow: hidden; border-radius: 2px; background: #ffffff12 }
      #splash .bar::after { content: ""; position: absolute; top: 0; bottom: 0; left: -30%; width: 30%; border-radius: 2px;
        background: linear-gradient(90deg, transparent, #68f4d1, #4cdcf2, #9673ff, transparent); animation: splash-load 1.2s ease-in-out infinite }
      #splash .meta { display: flex; justify-content: space-between; font: 500 11px "JetBrains Mono", Consolas, monospace; letter-spacing: .4px; color: #84919f }
      #splash .meta #splash-status { color: #68f4d1cc }
      #splash .legal { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; font: 10px "JetBrains Mono", Consolas, monospace; color: #46515e; letter-spacing: 1.6px; text-transform: uppercase }

      @keyframes splash-rise { from { opacity: 0; transform: translateY(10px) } }
      @keyframes splash-arrive { 0% { opacity: 0; transform: translate(-90px, 26px) rotate(-8deg) } 70% { opacity: 1 } 100% { transform: none } }
      @keyframes splash-hover { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
      @keyframes splash-flap { from { transform: scale(1, 1) } to { transform: scale(.84, .5) } }
      @keyframes splash-trail { 0% { stroke-dashoffset: 0; opacity: 0 } 20% { opacity: .9 } 100% { stroke-dashoffset: -420; opacity: 0 } }
      @keyframes splash-type { to { opacity: 1 } }
      @keyframes splash-caret { 50% { opacity: 0 } }
      @keyframes splash-fade { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }
      @keyframes splash-load { to { left: 100% } }
      @keyframes splash-breathe { 50% { opacity: .55 } }
      @keyframes splash-twinkle { 50% { opacity: .15 } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; animation-delay: 0s !important }
        #splash .word span, #splash .tagline { opacity: 1 }
      }
    </style>
  </head>

  <body>
    <div id="splash" role="status" aria-label="Starting Veyra Studio">
      <div class="sky" aria-hidden="true">
        <svg width="100%" height="100%" preserveAspectRatio="none">
          <g fill="#ffffff">
            <circle cx="8%" cy="14%" r="1.2" opacity=".6" style="animation: splash-twinkle 3s ease-in-out infinite" />
            <circle cx="22%" cy="72%" r="1" opacity=".45" style="animation: splash-twinkle 4s ease-in-out -1s infinite" />
            <circle cx="34%" cy="22%" r=".8" opacity=".4" />
            <circle cx="68%" cy="16%" r="1.1" opacity=".55" style="animation: splash-twinkle 3.5s ease-in-out -2s infinite" />
            <circle cx="82%" cy="64%" r="1.2" opacity=".5" style="animation: splash-twinkle 4.5s ease-in-out infinite" />
            <circle cx="91%" cy="28%" r=".9" opacity=".45" />
            <circle cx="58%" cy="84%" r=".9" opacity=".35" style="animation: splash-twinkle 3.2s ease-in-out -1.5s infinite" />
            <circle cx="14%" cy="44%" r=".8" opacity=".35" />
          </g>
        </svg>
        <div class="halo"></div>
        <div class="aurora"></div>
      </div>

      <div class="stage">
        <div class="row">
          <!-- the hummingbird -->
          <svg class="bird" viewBox="96 74 352 388" aria-hidden="true" focusable="false">
            <defs>
              <linearGradient id="sp-wl" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4c3be0" /><stop offset="1" stop-color="#8f7dff" /></linearGradient>
              <linearGradient id="sp-wr" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3a2bc4" /><stop offset="1" stop-color="#6d5cf6" /></linearGradient>
              <linearGradient id="sp-body" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#241a7a" /><stop offset=".55" stop-color="#4a38d6" /><stop offset="1" stop-color="#7a6af8" /></linearGradient>
              <linearGradient id="sp-throat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cf5b6" /><stop offset=".5" stop-color="#3ddc84" /><stop offset="1" stop-color="#14a6a0" /></linearGradient>
              <linearGradient id="sp-beak" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f7dff" /><stop offset="1" stop-color="#d2cbff" /></linearGradient>
              <linearGradient id="sp-trail" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#8f7dff" /><stop offset="1" stop-color="#3ddc84" stop-opacity="0" /></linearGradient>
            </defs>
            <!-- motion trails it leaves as it arrives -->
            <path class="trail" d="M196 392 C 120 420, 40 410, -60 380" fill="none" stroke="url(#sp-trail)" stroke-width="4" stroke-linecap="round" />
            <path class="trail" d="M214 340 C 140 360, 60 356, -40 330" fill="none" stroke="url(#sp-trail)" stroke-width="3" stroke-linecap="round" style="animation-delay: .32s" />
            <g class="hover">
              <g class="wl">
                <path d="M244 270 C 214 214, 172 156, 118 104 C 170 118, 232 176, 276 252 Z" fill="url(#sp-wl)" />
                <path d="M250 262 C 228 222, 196 182, 150 138 C 196 158, 238 202, 266 252 Z" fill="#ffffff" opacity=".12" />
              </g>
              <g class="wr">
                <path d="M262 262 C 270 198, 296 142, 346 88 C 334 152, 314 214, 292 270 Z" fill="url(#sp-wr)" />
                <path d="M270 252 C 280 204, 298 162, 328 122 C 318 166, 304 210, 288 256 Z" fill="#ffffff" opacity=".16" />
              </g>
              <path d="M340 230 C 342 202, 312 194, 288 206 C 258 222, 236 250, 218 288 C 200 326, 180 356, 154 394 L 132 438 L 172 410 L 170 452 L 198 392 C 240 362, 282 330, 310 298 C 328 276, 340 254, 340 230 Z" fill="url(#sp-body)" />
              <path d="M340 230 C 342 202, 312 194, 288 206 C 258 222, 236 250, 218 288 C 244 262, 280 238, 340 230 Z" fill="#ffffff" opacity=".12" />
              <path d="M338 240 C 334 262, 318 282, 296 296 C 300 278, 306 262, 316 248 C 322 244, 330 240, 338 240 Z" fill="url(#sp-throat)" />
              <path d="M338 240 C 330 246, 322 254, 316 264 C 326 258, 334 250, 338 240 Z" fill="#d8ffe9" opacity=".7" />
              <circle cx="316" cy="226" r="7" fill="#0c0a2a" /><circle cx="318.5" cy="223.5" r="2.4" fill="#ffffff" />
              <path d="M336 222 L 446 213 L 338 238 Z" fill="url(#sp-beak)" />
            </g>
          </svg>
          <!-- "Veyra Studio" typed from the cursor at its beak -->
          <div class="word" aria-label="Veyra Studio">
            <span style="animation-delay: .55s">V</span><span style="animation-delay: .61s">e</span><span style="animation-delay: .67s">y</span><span style="animation-delay: .73s">r</span><span style="animation-delay: .79s">a</span><span class="sp" style="animation-delay: .85s">&nbsp;</span><span class="studio" style="animation-delay: .9s">S</span><span class="studio" style="animation-delay: .96s">t</span><span class="studio" style="animation-delay: 1.02s">u</span><span class="studio" style="animation-delay: 1.08s">d</span><span class="studio" style="animation-delay: 1.14s">i</span><span class="studio" style="animation-delay: 1.2s">o</span><i class="caret"></i>
          </div>
        </div>
        <p class="tagline">The lightweight <em>VS Code alternative</em></p>
      </div>

      <div class="foot">
        <div class="bar"></div>
        <div class="meta"><span id="splash-status">Starting Veyra Studio…</span><span id="splash-version"></span></div>
      </div>
      <div class="legal">© 2026 FlightCoders</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

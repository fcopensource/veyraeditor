      #splash .stars.mid { width: 1.5px; height: 1.5px; box-shadow: 69.2vw 68.2vh #d7d1ff,70.6vw 98.1vh #ffffff,68.0vw 56.7vh #a8f7e5,63.0vw 56.7vh #ffffff,2.3vw 86.3vh #d7d1ff,97.6vw 30.8vh #d7d1ff,93.8vw 57.1vh #a8f7e5,19.8vw 24.2vh #d7d1ff,43.2vw 4.7vh #d7d1ff,78.1vw 84.0vh #d7d1ff,30.6vw 61.5vh #ffffff,31.7vw 29.0vh #d7d1ff,36.9vw 43.2vh #ffffff,50.4vw 54.4vh #d7d1ff,62.3vw 89.8vh #d7d1ff,46.2vw 83.2vh #a8f7e5,64.9vw 40.5vh #a8f7e5,5.3vw 28.6vh #d7d1ff,84.1vw 11.2vh #ffffff,66.6vw 22.1vh #ffffff,14.1vw 76.0vh #ffffff,62.5vw 75.6vh #ffffff,82.5vw 91.1vh #ffffff,95.4vw 7.3vh #a8f7e5,3.9vw 98.3vh #ffffff,27.7vw 52.3vh #d7d1ff,70.8vw 79.1vh #a8f7e5,11.5vw 61.7vh #ffffff,8.8vw 28.8vh #a8f7e5,77.0vw 67.6vh #d7d1ff,15.7vw 93.0vh #d7d1ff,61.8vw 72.2vh #a8f7e5,88.9vw 16.0vh #ffffff,69.7vw 42.1vh #d7d1ff,98.5vw 44.8vh #d7d1ff,66.1vw 10.2vh #d7d1ff,18.4vw 83.8vh #ffffff,99.6vw 54.1vh #d7d1ff,47.9vw 50.8vh #ffffff,54.2vw 81.9vh #ffffff,21.1vw 6.7vh #d7d1ff,43.6vw 13.0vh #d7d1ff,2.1vw 91.3vh #a8f7e5,89.0vw 66.9vh #a8f7e5,84.1vw 27.5vh #a8f7e5,46.6vw 0.1vh #a8f7e5,8.9vw 5.9vh #ffffff,12.0vw 22.2vh #d7d1ff,65.4vw 24.4vh #d7d1ff,71.6vw 75.0vh #ffffff,86.3vw 18.0vh #a8f7e5,54.7vw 40.4vh #ffffff,40.7vw 55.1vh #d7d1ff,85.3vw 40.8vh #a8f7e5,97.3vw 73.9vh #d7d1ff,23.9vw 96.1vh #a8f7e5,71.3vw 56.8vh #a8f7e5,89.4vw 18.2vh #d7d1ff,44.2vw 77.0vh #d7d1ff,69.2vw 61.2vh #a8f7e5,29.7vw 76.0vh #ffffff,3.4vw 55.2vh #d7d1ff,1.1vw 95.2vh #a8f7e5,54.8vw 86.1vh #a8f7e5,91.7vw 5.5vh #a8f7e5,36.3vw 69.9vh #a8f7e5,41.2vw 7.9vh #ffffff,37.0vw 31.5vh #ffffff,1.2vw 39.7vh #d7d1ff,80.1vw 82.0vh #d7d1ff; opacity: .75; animation: splash-drift-mid 3.2s cubic-bezier(.2, .6, .3, 1) both }
      #splash .stars.near { width: 2px; height: 2px; box-shadow: 44.3vw 57.2vh #ffffff,13.5vw 11.7vh #68f4d1,4.5vw 27.7vh #68f4d1,18.6vw 96.9vh #68f4d1,55.9vw 15.8vh #b79bff,70.1vw 28.4vh #68f4d1,30.9vw 39.0vh #68f4d1,0.7vw 22.0vh #ffffff,65.6vw 3.1vh #68f4d1,8.6vw 10.8vh #b79bff,68.3vw 68.0vh #b79bff,94.0vw 5.9vh #68f4d1,16.5vw 36.7vh #ffffff,20.2vw 3.2vh #ffffff,51.0vw 97.1vh #ffffff,51.6vw 62.9vh #ffffff,91.8vw 67.5vh #ffffff,93.8vw 69.1vh #b79bff,38.6vw 44.6vh #ffffff,14.9vw 40.5vh #ffffff,64.2vw 67.8vh #b79bff,85.2vw 53.8vh #b79bff,34.3vw 96.0vh #ffffff,73.7vw 83.1vh #68f4d1,76.8vw 36.1vh #68f4d1,1.4vw 56.0vh #68f4d1; animation: splash-drift-near 3.2s cubic-bezier(.2, .6, .3, 1) both, splash-twinkle 2.2s ease-in-out .4s infinite }
      #splash .nebula { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; animation: splash-nebula 6s ease-in-out infinite alternate }
      #splash .nebula.a { left: 8%; top: 8%; width: 46vw; height: 38vh; background: radial-gradient(closest-side, #6d5cf655, transparent) }
      #splash .nebula.b { right: 4%; top: 30%; width: 40vw; height: 40vh; background: radial-gradient(closest-side, #19c9c033, transparent); animation-delay: -3s }
      /* the grid: a plane hinged at the bottom of the screen and laid flat, running away to the horizon */
      #splash .floor { position: absolute; left: -100vw; right: -100vw; top: 100vh; height: 600vh; transform: rotateX(-90deg); transform-origin: 50% 0;
        background:
          linear-gradient(#8f7dffaa 2px, transparent 2px) 0 0 / 100% 90px,
          linear-gradient(90deg, #68f4d177 2px, transparent 2px) 50% 0 / 90px 100%;
        -webkit-mask-image: linear-gradient(#000 4%, #0008 18%, transparent 60%); mask-image: linear-gradient(#000 4%, #0008 18%, transparent 60%);
        opacity: 0; animation: splash-fade-in .9s ease .1s forwards, splash-floor 1.2s linear infinite }
      #splash .horizon { position: absolute; left: 0; right: 0; top: 66vh; height: 2px; opacity: 0;
        background: linear-gradient(90deg, transparent, #68f4d1aa 30%, #b79bffcc 70%, transparent); box-shadow: 0 0 24px #68f4d188, 0 0 60px #8f7dff66;
        animation: splash-fade-in 1s ease .35s forwards }

      /* --- stage --- */
      #splash .stage { position: relative; display: grid; justify-items: center; gap: clamp(14px, 2.4vh, 24px); margin-top: -4vh;
        transition: transform .65s cubic-bezier(.6, 0, .4, 1), filter .65s ease }
      #splash.done .stage { transform: scale(1.08); filter: blur(8px) }
      #splash .row { position: relative; display: flex; align-items: center }

      /* the bird: flies in along a curve, lands, hovers; zips off up-right when the editor is ready */
      #splash .exit { position: relative; transition: transform .55s cubic-bezier(.5, 0, .8, .4) }
      #splash.done .exit { transform: translate(70vw, -60vh) rotate(-18deg) scale(.7) }
      #splash .fly { animation: splash-fly 1s cubic-bezier(.25, .7, .3, 1) both }
      #splash .bird { display: block; width: clamp(110px, 12.5vw, 184px); height: auto; overflow: visible; margin-right: 6px;
        filter: drop-shadow(0 0 22px #6d5cf688) drop-shadow(0 12px 30px #0008) }
      #splash .hover { animation: splash-hover 2.4s ease-in-out 1s infinite }
      #splash .wl { transform-box: fill-box; transform-origin: 100% 100%; animation: splash-flap .12s ease-in-out infinite alternate }
      #splash .wr { transform-box: fill-box; transform-origin: 0% 100%; animation: splash-flap .12s ease-in-out -.06s infinite alternate }

      /* the trail of light and code it leaves behind (positioned from the bird's landing spot) */
      #splash .trail { position: absolute; left: calc(clamp(55px, 6.2vw, 92px) - 48vw); top: calc(50% - 14vh); width: 48vw; height: 32vh; overflow: visible; pointer-events: none;
        clip-path: inset(-40% 100% -40% 0); animation: splash-wipe .95s cubic-bezier(.25, .7, .3, 1) both }
      #splash .trail path { fill: none; stroke-linecap: round; animation: splash-fade-out .9s ease 1s forwards }
      #splash .glyphs { position: absolute; left: calc(clamp(55px, 6.2vw, 92px) - 48vw); top: calc(50% - 14vh); width: 48vw; height: 32vh; pointer-events: none }
      #splash .glyphs b { position: absolute; font: 700 clamp(13px, 1.3vw, 18px) "JetBrains Mono", Consolas, monospace; color: #68f4d1; text-shadow: 0 0 12px currentColor; opacity: 0;
        animation: splash-glyph 1.5s ease-out both }
      #splash .glyphs b:nth-child(even) { color: #b79bff }
      #splash .glyphs b:nth-child(3n) { color: #4cdcf2 }

      /* landing: rings of light and a flare */
      #splash .pulse { position: absolute; left: clamp(55px, 6.2vw, 92px); top: 50%; width: 0; height: 0; pointer-events: none }
      #splash .pulse i { position: absolute; left: -90px; top: -90px; width: 180px; height: 180px; border-radius: 50%; border: 2px solid #68f4d1; opacity: 0;
        box-shadow: 0 0 30px #68f4d166, inset 0 0 30px #68f4d133; animation: splash-ring 1.1s cubic-bezier(.2, .7, .3, 1) .88s both }
      #splash .pulse i + i { border-color: #b79bff; box-shadow: 0 0 30px #b79bff66; animation-delay: 1.02s }
      #splash .pulse s { position: absolute; left: -160px; top: -160px; width: 320px; height: 320px; border-radius: 50%; opacity: 0;
        background: radial-gradient(closest-side, #ffffffaa, #68f4d144 35%, transparent 70%); animation: splash-flare .9s ease-out .84s both }

      /* the name: typed from the cursor at the beak, then a wave of light across the letters */
      #splash .word { display: flex; align-items: center; width: 6.3em; height: 1.3em; margin-top: -22px; font-size: clamp(38px, 4.6vw, 64px) }
      #splash .word span { display: inline-block; max-width: 0; overflow: hidden; white-space: pre; font-size: 1em; line-height: 1.2; font-weight: 750; letter-spacing: -.03em; color: #edf5f5; opacity: 0;
        animation: splash-type .01s linear var(--d) both, splash-glint .7s ease-in-out calc(var(--d) + 1.05s) both }
      #splash .word .sp { width: .28em }
      #splash .word .studio { color: transparent; background: linear-gradient(100deg, #68f4d1, #4cdcf2, #b79bff) 0 0 / 600% 100%; -webkit-background-clip: text; background-clip: text }
      #splash .word .studio:nth-of-type(8) { background-position: 20% 0 } #splash .word .studio:nth-of-type(9) { background-position: 40% 0 }
      #splash .word .studio:nth-of-type(10) { background-position: 60% 0 } #splash .word .studio:nth-of-type(11) { background-position: 80% 0 }
      #splash .word .studio:nth-of-type(12) { background-position: 100% 0 }
      #splash .caret { flex: none; width: 5px; height: .92em; margin-left: 7px; border-radius: 3px; background: #68f4d1; box-shadow: 0 0 18px #68f4d1aa, 0 0 40px #68f4d155;
        animation: splash-caret 1s steps(1) .5s infinite }
      #splash .tagline { margin: -4px 0 0; font-size: clamp(14px, 1.35vw, 18px); letter-spacing: .2px; color: #9aa7b4; opacity: 0; animation: splash-rise .7s ease 1.3s both }
      #splash .tagline em { font-style: normal; font-weight: 650; color: transparent; background: linear-gradient(100deg, #68f4d1, #4cdcf2, #b79bff); -webkit-background-clip: text; background-clip: text }

      /* --- bottom: a progress bar that fills as the editor loads --- */
      #splash .foot { position: absolute; left: 0; right: 0; margin: 0 auto; bottom: clamp(30px, 6vh, 54px); width: min(480px, calc(100vw - 48px)); display: grid; gap: 12px;
        opacity: 0; animation: splash-rise .6s ease .5s both }
      #splash .bar { position: relative; height: 3px; overflow: hidden; border-radius: 3px; background: #ffffff12 }
      #splash .fill { position: absolute; left: 0; top: 0; bottom: 0; width: calc(max(var(--p), .06) * 100%); border-radius: inherit; overflow: hidden;
        background: linear-gradient(90deg, #68f4d1, #4cdcf2 55%, #9673ff); box-shadow: 0 0 14px #68f4d1aa; transition: width .55s cubic-bezier(.3, .7, .3, 1) }
      #splash .fill::after { content: ""; position: absolute; top: 0; bottom: 0; width: 60px; left: -60px; background: linear-gradient(90deg, transparent, #ffffffcc, transparent);
        animation: splash-shine 1.1s ease-in-out infinite }
      #splash .meta { display: flex; justify-content: space-between; gap: 16px; font: 500 11px "JetBrains Mono", Consolas, monospace; letter-spacing: .4px; color: #84919f }
      #splash .meta #splash-status { color: #68f4d1cc }
      #splash .legal { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; font: 10px "JetBrains Mono", Consolas, monospace; color: #46515e; letter-spacing: 1.6px; text-transform: uppercase }

      @keyframes splash-drift { from { transform: scale(1) } to { transform: scale(1.06) } }
      @keyframes splash-drift-mid { from { transform: scale(.96); opacity: 0 } 30% { opacity: .75 } to { transform: scale(1.16) } }
      @keyframes splash-drift-near { from { transform: scale(.9); opacity: 0 } 30% { opacity: 1 } to { transform: scale(1.38) } }
      @keyframes splash-twinkle { 50% { opacity: .55 } }
      @keyframes splash-nebula { to { transform: translate(3vw, 2vh) scale(1.1) } }
      @keyframes splash-floor { from { background-position: 0 90px, 50% 0 } to { background-position: 0 0, 50% 0 } }
      @keyframes splash-fly {
        0% { opacity: 0; transform: translate(-48vw, 15vh) rotate(16deg) scale(.45) }
        12% { opacity: 1 }
        50% { transform: translate(-19vw, -7vh) rotate(-7deg) scale(.8) }
        78% { transform: translate(-3vw, 2vh) rotate(5deg) scale(1.04) }
        100% { opacity: 1; transform: none }
      }
      @keyframes splash-hover { 50% { transform: translateY(-7px) } }
      @keyframes splash-flap { from { transform: scale(1, 1) } to { transform: scale(.84, .45) } }
      @keyframes splash-wipe { to { clip-path: inset(-40% 0 -40% 0) } }
      @keyframes splash-glyph { 0% { opacity: 0; transform: scale(.4) } 15% { opacity: 1; transform: scale(1.15) } 100% { opacity: 0; transform: translate(var(--dx, 0), var(--dy, -40px)) scale(.8) rotate(var(--r, 0deg)) } }
      @keyframes splash-ring { 0% { opacity: 0; transform: scale(.15) } 8% { opacity: .95; transform: scale(.3) } 100% { opacity: 0; transform: scale(2.3) } }
      @keyframes splash-flare { 0% { opacity: 0; transform: scale(.3) } 30% { opacity: .9 } 100% { opacity: 0; transform: scale(1.4) } }
      @keyframes splash-type { to { opacity: 1; max-width: 1.4em; overflow: visible } }
      @keyframes splash-glint { 0%, 100% { filter: none; transform: none } 45% { filter: brightness(1.7) drop-shadow(0 0 14px #68f4d1cc); transform: translateY(-3px) } }
      @keyframes splash-caret { 50% { opacity: 0 } }
      @keyframes splash-rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      @keyframes splash-fade-in { to { opacity: 1 } }
      @keyframes splash-fade-out { to { opacity: 0 } }
      @keyframes splash-shine { to { left: 100% } }

      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::before, #splash *::after { animation: none !important; transition: none !important }
        #splash .word span, #splash .tagline, #splash .foot, #splash .floor, #splash .horizon, #splash .stars { opacity: 1 }
        #splash .word span { max-width: none; overflow: visible }
        #splash .floor { opacity: .7 }
        #splash .trail, #splash .glyphs, #splash .pulse { display: none }
        #splash.done .stage, #splash.done .exit { transform: none; filter: none }
      }
    </style>
  </head>

  <body>
    <div id="splash" role="status" aria-label="Starting Veyra Studio">
      <div class="space" aria-hidden="true">
        <div class="nebula a"></div><div class="nebula b"></div>

        <div class="horizon"></div>
        <div class="floor"></div>

            <b style="left: 13.9%; top: 89.5%; animation-delay: 0.14s; --dx: 11px; --dy: -57px; --r: -10deg">}</b>
            <b style="left: 19.9%; top: 79.4%; animation-delay: 0.18s; --dx: 13px; --dy: -57px; --r: 11deg">&lt;/&gt;</b>

            <b style="left: 31.8%; top: 55.1%; animation-delay: 0.27s; --dx: 10px; --dy: -33px; --r: 11deg">=&gt;</b>
            <b style="left: 37.8%; top: 44.4%; animation-delay: 0.31s; --dx: 21px; --dy: -70px; --r: -23deg">()</b>
            <b style="left: 44.0%; top: 35.3%; animation-delay: 0.35s; --dx: 21px; --dy: -64px; --r: 9deg">[ ]</b>
            <b style="left: 50.4%; top: 24.2%; animation-delay: 0.39s; --dx: 21px; --dy: -75px; --r: -8deg">#</b>
            <b style="left: 57.2%; top: 19.5%; animation-delay: 0.43s; --dx: 17px; --dy: -47px; --r: -21deg">//</b>
            <b style="left: 64.4%; top: 23.3%; animation-delay: 0.47s; --dx: -4px; --dy: -45px; --r: 26deg">&lt;</b>
            <b style="left: 70.8%; top: 21.4%; animation-delay: 0.52s; --dx: 11px; --dy: -74px; --r: -26deg">/&gt;</b>
            <b style="left: 76.3%; top: 23.2%; animation-delay: 0.56s; --dx: 3px; --dy: -55px; --r: -5deg">*</b>
            <b style="left: 81.0%; top: 28.8%; animation-delay: 0.60s; --dx: 20px; --dy: -33px; --r: -8deg">&&</b>
            <b style="left: 84.9%; top: 30.0%; animation-delay: 0.64s; --dx: 8px; --dy: -76px; --r: 1deg">{ }</b>
          </div>
          <div class="pulse" aria-hidden="true"><s></s><i></i><i></i></div>

          <div class="exit"><div class="fly">
            <svg class="bird" viewBox="96 74 352 388" aria-hidden="true" focusable="false">
              <defs>
                <linearGradient id="sp-wl" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4c3be0" /><stop offset="1" stop-color="#8f7dff" /></linearGradient>
                <linearGradient id="sp-wr" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3a2bc4" /><stop offset="1" stop-color="#6d5cf6" /></linearGradient>
                <linearGradient id="sp-body" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#241a7a" /><stop offset=".55" stop-color="#4a38d6" /><stop offset="1" stop-color="#7a6af8" /></linearGradient>
                <linearGradient id="sp-throat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cf5b6" /><stop offset=".5" stop-color="#3ddc84" /><stop offset="1" stop-color="#14a6a0" /></linearGradient>
                <linearGradient id="sp-beak" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f7dff" /><stop offset="1" stop-color="#d2cbff" /></linearGradient>
              </defs>
              <g class="hover">
                <g class="wl">
                  <path d="M244 270 C 214 214, 172 156, 118 104 C 170 118, 232 176, 276 252 Z" fill="url(#sp-wl)" />

                <g class="wr">

                  <path d="M270 252 C 280 204, 298 162, 328 122 C 318 166, 304 210, 288 256 Z" fill="#ffffff" opacity=".16" />
                </g>
                <path d="M340 230 C 342 202, 312 194, 288 206 C 258 222, 236 250, 218 288 C 200 326, 180 356, 154 394 L 132 438 L 172 410 L 170 452 L 198 392 C 240 362, 282 330, 310 298 C 328 276, 340 254, 340 230 Z" fill="url(#sp-body)" />
                <path d="M340 230 C 342 202, 312 194, 288 206 C 258 222, 236 250, 218 288 C 244 262, 280 238, 340 230 Z" fill="#ffffff" opacity=".12" />
                <path d="M338 240 C 334 262, 318 282, 296 296 C 300 278, 306 262, 316 248 C 322 244, 330 240, 338 240 Z" fill="url(#sp-throat)" />
                <path d="M338 240 C 330 246, 322 254, 316 264 C 326 258, 334 250, 338 240 Z" fill="#d8ffe9" opacity=".7" />
                <circle cx="316" cy="226" r="7" fill="#0c0a2a" /><circle cx="318.5" cy="223.5" r="2.4" fill="#ffffff" />
                <path d="M336 222 L 446 213 L 338 238 Z" fill="url(#sp-beak)" />
              </g>
            </svg>
          </div></div>

          <div class="word" aria-label="Veyra Studio">
            <span style="--d: 0.860s">V</span><span style="--d: 0.915s">e</span><span style="--d: 0.970s">y</span><span style="--d: 1.025s">r</span><span style="--d: 1.080s">a</span><span class="sp" style="--d: 1.135s">&nbsp;</span><span class="studio" style="--d: 1.190s">S</span><span class="studio" style="--d: 1.245s">t</span><span class="studio" style="--d: 1.300s">u</span><span class="studio" style="--d: 1.355s">d</span><span class="studio" style="--d: 1.410s">i</span><span class="studio" style="--d: 1.465s">o</span><i class="caret"></i>
          </div>
        </div>
        <p class="tagline">The lightweight <em>VS Code alternative</em></p>
      </div>

      <div class="foot">
        <div class="bar"><div class="fill"></div></div>
        <div class="meta"><span id="splash-status">Starting Veyra Studio…</span><span id="splash-version"></span></div>
      </div>
      <div class="legal">© 2026 FlightCoders</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/veyra.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veyra</title>
    <style>
      /* Launch screen: a vector illustration drawn in inline SVG, shown by the HTML itself before any script runs,
         then faded out by main.tsx. No images, fonts or scripts to load. */
      html, body { margin: 0; background: #0b0c12 }
      #splash { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; background: radial-gradient(1100px 700px at 50% 40%, #151827 0%, #0d0f18 55%, #08090e 100%); font-family: Inter, "Segoe UI", system-ui, sans-serif; color: #e6e8ee; transition: opacity .5s ease, visibility .5s; -webkit-user-select: none; user-select: none; cursor: default }
      #splash.done { opacity: 0; visibility: hidden; pointer-events: none }
      #splash .card { position: relative; width: min(700px, calc(100vw - 40px)); overflow: hidden; border-radius: 18px; background: #11131c; border: 1px solid #ffffff14; box-shadow: 0 40px 100px #000c, 0 0 0 1px #0008, 0 0 120px #4f6bff1a; animation: splash-in .7s cubic-bezier(.2, .8, .2, 1) both }
      #splash .art { display: block; width: 100%; height: auto; aspect-ratio: 700 / 330 }
      #splash .foot { display: grid; gap: 14px; padding: 20px 30px 22px; background: linear-gradient(#11131c, #0e1017) }
      #splash .title { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px }
      #splash .title b { display: block; font-size: 26px; font-weight: 650; letter-spacing: -.5px; color: #f4f5f8 }
      #splash .title small { display: block; margin-top: 3px; font-size: 13px; color: #9aa0b4 }
      #splash .title em { font-style: normal; font-size: 12px; color: #7d8296; white-space: nowrap }
      #splash .status { font-size: 12px; color: #8f94a8 }
      #splash .bar { position: relative; height: 3px; overflow: hidden; border-radius: 3px; background: #ffffff0f }
      #splash .bar::after { content: ""; position: absolute; top: 0; bottom: 0; left: -35%; width: 35%; border-radius: 3px; background: linear-gradient(90deg, transparent, #5ee7ff, #8b7bff, #ff7ac6, transparent); animation: splash-load 1.3s ease-in-out infinite }
      #splash .legal { display: flex; justify-content: space-between; font-size: 11px; color: #5d6274 }

      /* Illustration motion */
      #splash .float { animation: splash-float 6s ease-in-out infinite }
      #splash .float2 { animation: splash-float 7.5s ease-in-out -2s infinite }
      #splash .flow { stroke-dasharray: 6 14; animation: splash-flow 3.2s linear infinite }
      #splash .flow2 { stroke-dasharray: 2 10; animation: splash-flow 4.6s linear infinite reverse }
      #splash .twinkle { animation: splash-twinkle 3s ease-in-out infinite }
      #splash .twinkle.d1 { animation-delay: -1s } #splash .twinkle.d2 { animation-delay: -2s }
      #splash .orbit { transform-origin: 175px 158px; animation: splash-spin 9s linear infinite }
      #splash .glow { animation: splash-glow 4s ease-in-out infinite }
      #splash .caret { animation: splash-blink 1s steps(1) infinite }

      @keyframes splash-in { from { opacity: 0; transform: translateY(12px) scale(.98) } }
      @keyframes splash-load { to { left: 100% } }
      @keyframes splash-float { 50% { transform: translateY(-7px) } }
      @keyframes splash-flow { to { stroke-dashoffset: -200 } }
      @keyframes splash-twinkle { 50% { opacity: .15 } }
      @keyframes splash-spin { to { transform: rotate(360deg) } }
      @keyframes splash-glow { 50% { opacity: .55 } }
      @keyframes splash-blink { 50% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::after { animation: none !important }
        #splash .bar::after { left: 0; width: 100%; opacity: .5 }
      }
    </style>
  </head>

  <body>
    <div id="splash" role="status" aria-label="Starting Veyra Studio">
      <div class="card">
        <svg class="art" viewBox="0 0 700 330" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
          <defs>
            <radialGradient id="sky" cx="30%" cy="45%" r="85%"><stop offset="0" stop-color="#1b2150" /><stop offset=".55" stop-color="#10132a" /><stop offset="1" stop-color="#0a0b16" /></radialGradient>
            <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6d7bff" stop-opacity=".55" /><stop offset="1" stop-color="#6d7bff" stop-opacity="0" /></radialGradient>
            <linearGradient id="rib1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" /><stop offset=".5" stop-color="#6d7bff" /><stop offset="1" stop-color="#ff7ac6" /></linearGradient>
            <linearGradient id="rib2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b7bff" /><stop offset="1" stop-color="#22d3ee" /></linearGradient>
            <linearGradient id="armL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cf0ff" /><stop offset="1" stop-color="#3b6bff" /></linearGradient>
            <linearGradient id="armR" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8fd0" /><stop offset="1" stop-color="#7a5cff" /></linearGradient>
            <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1e3a" /><stop offset="1" stop-color="#121427" /></linearGradient>
            <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14" /></filter>
            <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" /></filter>
          </defs>

          <rect width="700" height="330" fill="url(#sky)" />

          <!-- stars -->
          <g fill="#ffffff">
            <circle class="twinkle" cx="38" cy="40" r="1.2" opacity=".7" /><circle class="twinkle d1" cx="96" cy="78" r=".8" opacity=".5" />
            <circle class="twinkle d2" cx="262" cy="34" r="1.1" opacity=".6" /><circle cx="318" cy="96" r=".7" opacity=".4" />
            <circle class="twinkle" cx="388" cy="26" r="1" opacity=".55" /><circle class="twinkle d1" cx="462" cy="52" r=".8" opacity=".45" />
            <circle class="twinkle d2" cx="664" cy="36" r="1.3" opacity=".7" /><circle cx="612" cy="250" r=".8" opacity=".35" />
            <circle class="twinkle" cx="548" cy="300" r="1" opacity=".5" /><circle class="twinkle d1" cx="30" cy="292" r=".9" opacity=".45" />
            <circle cx="318" cy="292" r=".8" opacity=".35" /><circle class="twinkle d2" cx="680" cy="150" r=".9" opacity=".5" />
          </g>

          <!-- light ribbons -->
          <g class="glow">
            <path d="M-40 262 C 110 214, 220 300, 352 224 S 590 118, 740 150" fill="none" stroke="url(#rib1)" stroke-width="56" stroke-linecap="round" opacity=".22" filter="url(#blur)" />
          </g>
          <path d="M-40 262 C 110 214, 220 300, 352 224 S 590 118, 740 150" fill="none" stroke="url(#rib1)" stroke-width="18" stroke-linecap="round" opacity=".28" />
          <path class="flow" d="M-40 262 C 110 214, 220 300, 352 224 S 590 118, 740 150" fill="none" stroke="url(#rib1)" stroke-width="2" stroke-linecap="round" opacity=".9" />
          <path d="M-40 290 C 140 250, 250 318, 380 262 S 600 176, 740 206" fill="none" stroke="url(#rib2)" stroke-width="1.4" opacity=".55" />
          <path class="flow2" d="M-40 238 C 90 190, 200 268, 330 196 S 570 96, 740 112" fill="none" stroke="url(#rib2)" stroke-width="1.6" stroke-linecap="round" opacity=".6" />

          <!-- the Veyra V -->
          <g class="float">
            <circle cx="175" cy="158" r="92" fill="url(#halo)" />
            <ellipse cx="175" cy="158" rx="104" ry="34" fill="none" stroke="#8b9bff" stroke-opacity=".28" stroke-width="1.2" transform="rotate(-14 175 158)" />
            <g class="orbit"><circle cx="279" cy="158" r="3.4" fill="#7cf0ff" transform="rotate(-14 175 158)" /></g>
            <g filter="url(#soft)" opacity=".7">
              <polygon points="113,96 151,96 175,170 175,222" fill="url(#armL)" />
              <polygon points="199,96 237,96 175,222 175,170" fill="url(#armR)" />
            </g>
            <polygon points="113,96 151,96 175,170 175,222" fill="url(#armL)" />
            <polygon points="199,96 237,96 175,222 175,170" fill="url(#armR)" />
            <polygon points="113,96 151,96 141,112 123,112" fill="#ffffff" opacity=".35" />
            <polygon points="199,96 237,96 227,112 209,112" fill="#ffffff" opacity=".3" />
            <polygon points="151,96 175,170 168,170 141,112" fill="#ffffff" opacity=".12" />
          </g>

          <!-- constellation of code glyphs -->
          <g stroke="#9aa6ff" stroke-opacity=".35" stroke-width="1" stroke-dasharray="3 5" fill="none">
            <path d="M318 74 L 404 98" /><path d="M318 74 L 300 156" /><path d="M300 156 L 404 168" /><path d="M640 280 L 612 214" />
          </g>
          <g font-family="'JetBrains Mono', Consolas, monospace" font-weight="700" text-anchor="middle">
            <g class="float2"><circle cx="318" cy="74" r="17" fill="#141833" stroke="#7cf0ff" stroke-opacity=".55" /><text x="318" y="79" font-size="13" fill="#7cf0ff">{ }</text></g>
            <g class="float"><circle cx="300" cy="156" r="15" fill="#141833" stroke="#ff8fd0" stroke-opacity=".55" /><text x="300" y="160.5" font-size="11" fill="#ff8fd0">&lt;/&gt;</text></g>
            <g class="float2"><circle cx="640" cy="280" r="14" fill="#141833" stroke="#a78bfa" stroke-opacity=".55" /><text x="640" y="285" font-size="13" fill="#c4b5fd">λ</text></g>
          </g>

          <!-- floating code window -->
          <g class="float2" transform="rotate(-5 520 140)">
            <rect x="404" y="64" width="248" height="164" rx="12" fill="url(#win)" stroke="#ffffff22" />
            <rect x="404" y="64" width="248" height="26" rx="12" fill="#ffffff08" />
            <circle cx="420" cy="77" r="3.6" fill="#ff6b6b" /><circle cx="432" cy="77" r="3.6" fill="#ffc35a" /><circle cx="444" cy="77" r="3.6" fill="#4ade80" />
            <rect x="470" y="73" width="56" height="8" rx="4" fill="#ffffff14" />
            <g stroke-linecap="round" stroke-width="6">
              <path d="M422 108 h 34" stroke="#cf8e6d" /><path d="M464 108 h 52" stroke="#e6e8ee" stroke-opacity=".75" /><path d="M524 108 h 26" stroke="#56a8f5" />
              <path d="M438 128 h 44" stroke="#c77dff" /><path d="M490 128 h 70" stroke="#6aab73" />
              <path d="M438 148 h 26" stroke="#cf8e6d" /><path d="M472 148 h 40" stroke="#e6e8ee" stroke-opacity=".6" /><path d="M520 148 h 30" stroke="#2aacb8" />
              <path d="M454 168 h 60" stroke="#6aab73" /><path d="M522 168 h 22" stroke="#e6e8ee" stroke-opacity=".5" />
              <path d="M438 188 h 18" stroke="#56a8f5" /><path d="M464 188 h 48" stroke="#c77dff" />
              <path d="M422 208 h 12" stroke="#e6e8ee" stroke-opacity=".6" />
            </g>
            <rect class="caret" x="440" y="202" width="2.4" height="13" rx="1" fill="#7cf0ff" />
            <rect x="404" y="64" width="248" height="164" rx="12" fill="none" stroke="url(#rib1)" stroke-opacity=".35" />
          </g>
        </svg>
        <div class="foot">
          <div class="title"><span><b>Veyra Studio</b><small>The lightweight VS Code alternative</small></span><em id="splash-version"></em></div>
          <div class="status" id="splash-status">Starting Veyra Studio…</div>
          <div class="bar"></div>
          <div class="legal"><span>© 2026 FlightCoders</span><span>Powered by Veyra AI</span></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

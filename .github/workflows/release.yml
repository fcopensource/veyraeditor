# Builds Veyra installers for Windows, macOS and Linux and publishes them, together with the
# signed auto-update manifest (latest.json), to a draft GitHub Release.
#
# Release:  bump the version (npm run release:version 0.5.0), commit, then
#           git tag v0.5.0 && git push origin main v0.5.0
# Publish:  review the draft release on GitHub and click "Publish". Installed copies of Veyra
#           only see the update once the release is published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            platform: windows-latest
            args: ""
          - name: macOS (Apple silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux (x64)
            platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.args }}

      - run: npm ci

      # The CHANGELOG.md section for this version becomes the release notes and the
      # in-app "What's new" text shown in the update prompt.
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          notes=$(awk -v heading="## $version" '{sub(/\r$/,"")} $0==heading{found=1;next} /^## /{found=0} found' CHANGELOG.md)
          {
            echo "body<<VEYRA_NOTES_EOF"
            echo "${notes:-Veyra Studio $version}"
            echo
            echo "---"
            echo "**Download:** Windows \`.exe\`/\`.msi\` · macOS \`.dmg\` (\`aarch64\` = Apple silicon, \`x64\` = Intel) · Linux \`.AppImage\`/\`.deb\`/\`.rpm\`. Already installed? Veyra updates itself."
            echo "VEYRA_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the matching public key is in src-tauri/tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional OS code signing (removes "unidentified developer" / SmartScreen warnings).
          # Uncomment after adding the secrets; see docs/RELEASING.md.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: Veyra Studio v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

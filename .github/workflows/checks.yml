# Quality and security gates. Runs on every push and pull request, and the Release workflow
# runs it first: a release is only built when every check here passes.
#
# Dependency policy
#   npm (app):              any HIGH or CRITICAL advisory fails.
#   npm (language tools):   the exact packages Veyra installs for users (src-tauri/src/lsp.rs) are
#                           installed without scripts and audited; HIGH or CRITICAL fails.
#   cargo audit:            any vulnerability fails; "unmaintained"/"unsound" warnings are reported only.
name: Checks

on:
  push:
    branches: [main]
    paths-ignore: ["website/**", "**.md", "docs/**"]
  pull_request:
    paths-ignore: ["website/**", "**.md", "docs/**"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (TypeScript, build, Playwright)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npx vite build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright tests
        run: npx playwright test --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  rust:
    name: Rust (tests, clippy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      # The Tauri build script expects the web assets folder to exist.
      - run: mkdir -p dist
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: cargo clippy (errors fail; warnings are reported)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

  vscode-extension:
    name: VS Code extension (${{ matrix.name }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: live-server, name: Live Server }
          - { dir: port-manager, name: Port Manager }
    defaults:
      run:
        working-directory: extensions/${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Integration test in VS Code
        run: xvfb-run -a npm run test:integration
      - name: Package
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-${{ matrix.dir }}-vsix
          path: extensions/${{ matrix.dir }}/dist/*.vsix
          retention-days: 14

  # Port Manager reads ports differently on each system (PowerShell/netstat, lsof, ss): test it on all of them.
  port-manager-platforms:
    name: Port Manager on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: extensions/port-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/port-manager/package-lock.json
      - run: npm ci
      - name: Tests (including a real server found, stopped and freed)
        run: npm test

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm audit (app)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (language tools installed for users)
        run: node scripts/audit-language-tools.mjs
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock

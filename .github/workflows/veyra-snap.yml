# veyra-snap, the Python library in python/veyra-snap: tests on every change, and publishing to PyPI by hand.
#
# Publishing uses PyPI Trusted Publishing, so no password or token is stored anywhere. One-time setup on
# https://pypi.org/manage/account/publishing/ ("Add a new pending publisher"):
#   PyPI project name: veyra-snap    Owner: fcopensource    Repository: veyraeditor
#   Workflow name: veyra-snap.yml    Environment name: pypi
# Then: Actions -> "veyra-snap (Python)" -> Run workflow -> publish: pypi.
# (For a trial run first, add the same pending publisher on https://test.pypi.org with environment "testpypi".)
name: veyra-snap (Python)

on:
  push:
    branches: [main]
    paths: ["python/veyra-snap/**", ".github/workflows/veyra-snap.yml"]
  pull_request:
    paths: ["python/veyra-snap/**", ".github/workflows/veyra-snap.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version
        type: choice
        options: [none, testpypi, pypi]
        default: none

permissions:
  contents: read

defaults:
  run:
    working-directory: python/veyra-snap

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest
      - run: python -m pytest -q -p no:cacheprovider

  build:
    name: Build
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/veyra-snap/dist/

  publish:
    name: Publish to ${{ inputs.publish }}
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish != 'none'
    runs-on: ubuntu-22.04
    environment:
      name: ${{ inputs.publish }}
      url: ${{ inputs.publish == 'pypi' && 'https://pypi.org/project/veyra-snap/' || 'https://test.pypi.org/project/veyra-snap/' }}
    permissions:
      id-token: write  # Trusted Publishing
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.publish == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          packages-dir: dist/

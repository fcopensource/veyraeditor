name: Veyra Launch extension
on:
  push:
    paths: ['extensions/veyra-launch/**', '.github/workflows/veyra-launch.yml']
  pull_request:
    paths: ['extensions/veyra-launch/**', '.github/workflows/veyra-launch.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extensions/veyra-launch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/veyra-launch/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-launch-${{ matrix.os }}
          path: extensions/veyra-launch/*.vsix

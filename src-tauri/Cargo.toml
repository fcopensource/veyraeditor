[package]
name = "veyra"
version = "0.5.0"
description = "Veyra desktop code editor"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "veyra_lib"
# Desktop-only: "cdylib" (mobile) exceeds the GNU linker's 65k export limit on Windows.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
portable-pty = "0.9.0"
tempfile = "3.27.0"
trash = "5.2.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "macros"] }
regex = "1"
base64 = "0.22"
dunce = "1"

# API keys live in the OS credential store (Windows Credential Manager, macOS Keychain, Secret Service).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# Dependencies (tauri, windows, etc.) build without debug info: far less memory and disk,
# while Veyra's own code keeps it for debugging.
[profile.dev.package."*"]
debug = false

# Smaller, faster release binary (Tauri's recommended size settings).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

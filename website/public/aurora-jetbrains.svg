<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050916"/>
      <stop offset="0.55" stop-color="#0D1634"/>
      <stop offset="1" stop-color="#1B2C60"/>
    </linearGradient>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="54"/></clipPath>
    <!-- Pink and violet fringe on top, green curtain, teal below: the colours of a real aurora -->
    <linearGradient id="fringe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7A8D8" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#E39BE0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#B39DFF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9FFE8" stop-opacity="1"/>
      <stop offset="0.12" stop-color="#5EF2B5" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#2FD3A0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2CC7DB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BF3FF" stop-opacity="0.9"/>
      <stop offset="0.2" stop-color="#4FD6E8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7AA2FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EF2B5" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#C3A6FF" stop-opacity=".6"/>
    </linearGradient>
    <!-- Vertical rays: thin streaks that only show inside the green curtain -->
    <pattern id="rays" width="9" height="256" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2.2" height="256" fill="url(#rayfade)"/>
      <rect x="5" y="0" width="1.2" height="256" fill="url(#rayfade)" opacity=".6"/>
    </pattern>
    <clipPath id="greenShape"><path d="M8 112 C 50 64, 92 124, 132 86 S 208 50, 248 88 L 248 178 C 196 150, 150 192, 98 158 S 30 166, 8 178 Z"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="8" y="8" width="240" height="240" fill="url(#sky)"/>
    <!-- Stars and a gold starlight sparkle -->
    <g fill="#ffffff">
      <circle cx="40" cy="38" r="1.8" opacity=".9"/><circle cx="84" cy="24" r="1.1" opacity=".7"/>
      <circle cx="150" cy="30" r="1.3" opacity=".75"/><circle cx="118" cy="52" r="0.9" opacity=".55"/>
      <circle cx="228" cy="58" r="1.1" opacity=".6"/><circle cx="24" cy="78" r="1" opacity=".5"/>
    </g>
    <path d="M204 22 l2.6 6.6 6.6 2.6 -6.6 2.6 -2.6 6.6 -2.6 -6.6 -6.6 -2.6 6.6 -2.6z" fill="#FFCF7A"/>

    <!-- The glow behind it all -->
    <path d="M8 112 C 50 64, 92 124, 132 86 S 208 50, 248 88 L 248 190 L 8 190 Z" fill="#3FD6A0" opacity=".55" filter="url(#glow)"/>
    <!-- Pink / violet fringe above the green -->
    <path d="M8 104 C 50 52, 92 110, 132 72 S 208 34, 248 74 L 248 96 C 208 62, 170 92, 132 96 S 50 80, 8 122 Z" fill="url(#fringe)" filter="url(#soft)"/>
    <!-- Green curtain with rays -->
    <path d="M8 112 C 50 64, 92 124, 132 86 S 208 50, 248 88 L 248 178 C 196 150, 150 192, 98 158 S 30 166, 8 178 Z" fill="url(#green)"/>
    <g clip-path="url(#greenShape)"><rect x="8" y="40" width="240" height="160" fill="url(#rays)" opacity=".5"/></g>
    <!-- Teal curtain below -->
    <path d="M8 156 C 56 124, 96 174, 140 142 S 212 118, 248 146 L 248 214 C 200 194, 152 226, 104 202 S 34 208, 8 220 Z" fill="url(#teal)" opacity=".8"/>
    <!-- The bright top edge -->
    <path d="M8 112 C 50 64, 92 124, 132 86 S 208 50, 248 88" fill="none" stroke="#E6FFF5" stroke-width="2.4" opacity=".9"/>

    <!-- Mountains with a moonlit ridge and a snowy peak -->
    <path d="M8 214 L 58 172 L 82 190 L 122 148 L 160 186 L 190 164 L 248 206 L 248 248 L 8 248 Z" fill="#060A16"/>
    <path d="M8 214 L 58 172 L 82 190 L 122 148 L 160 186 L 190 164 L 248 206" fill="none" stroke="#8FB4FF" stroke-width="2" stroke-linejoin="round" opacity=".6"/>
    <path d="M112 158.5 L 122 148 L 132 157.5 L 126 155.5 L 122 159.5 L 117.5 156 Z" fill="#E6EEFA"/>
  </g>
  <rect x="9" y="9" width="238" height="238" rx="53" fill="none" stroke="url(#rim)" stroke-width="2"/>
</svg>

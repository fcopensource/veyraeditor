<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><title>Veyra AI</title>
  <defs>
    <linearGradient id="la" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ff3ff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="lb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="ld" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
    <linearGradient id="le" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#db2777"/></linearGradient>
    <linearGradient id="lf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e879f9"/><stop offset="1" stop-color="#a21caf"/></linearGradient>
    <linearGradient id="lh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <radialGradient id="core" cx="40%" cy="35%" r="65%"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#e0e7ff"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/><stop offset=".6" stop-color="#22d3ee" stop-opacity=".12"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1e1b4b" flood-opacity=".55"/></filter>
  </defs>
  <circle cx="50" cy="52" r="46" fill="url(#glow)"/>
  <g filter="url(#shadow)" stroke="#ffffff" stroke-opacity=".18" stroke-width=".6" stroke-linejoin="round">
    <!-- top arm: lit left facet, shaded right facet -->
    <path d="M50 6 L34 34 L50 50 Z" fill="url(#la)"/>
    <path d="M50 6 L50 50 L66 34 Z" fill="url(#lb)"/>
    <!-- right arm -->
    <path d="M94 50 L66 34 L50 50 Z" fill="url(#lc)"/>
    <path d="M94 50 L50 50 L66 66 Z" fill="url(#ld)"/>
    <!-- bottom arm -->
    <path d="M50 94 L66 66 L50 50 Z" fill="url(#le)"/>
    <path d="M50 94 L50 50 L34 66 Z" fill="url(#lf)"/>
    <!-- left arm -->
    <path d="M6 50 L34 66 L50 50 Z" fill="url(#lg)"/>
    <path d="M6 50 L50 50 L34 34 Z" fill="url(#lh)"/>
  </g>
  <!-- glossy core and highlight -->
  <circle cx="50" cy="50" r="12" fill="url(#core)"/>
  <path d="M50 11 L37 33 L44.5 40 Z" fill="#ffffff" fill-opacity=".55"/>
  <!-- small companion spark -->
  <path d="M81 8 L83.6 15.4 L91 18 L83.6 20.6 L81 28 L78.4 20.6 L71 18 L78.4 15.4 Z" fill="url(#lc)" stroke="#ffffff" stroke-opacity=".7" stroke-width=".8" stroke-linejoin="round"/>
</svg>
